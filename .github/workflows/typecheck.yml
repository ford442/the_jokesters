name: Typecheck

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typecheck.yml'
      - 'eslint.config.mjs'
      - 'scripts/check-any-ratchet.mjs'
      - 'scripts/lint-any-baseline.json'
      - 'scripts/wllama-wasm.manifest.json'
      - 'scripts/verify_wllama_wasm.sh'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/typecheck.yml'
      - 'eslint.config.mjs'
      - 'scripts/check-any-ratchet.mjs'
      - 'scripts/lint-any-baseline.json'
      - 'scripts/wllama-wasm.manifest.json'
      - 'scripts/verify_wllama_wasm.sh'
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify wllama WASM alignment
        run: npm run verify:wllama

      - name: Typecheck
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ESLint errors fail the job; the `no-explicit-any` count is ratcheted
      # (scripts/lint-any-baseline.json) and may only go down.
      - name: Lint
        run: npm run lint:ci
