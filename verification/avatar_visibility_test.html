<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Visibility Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            max-width: 350px;
        }
        h1 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #4ecdc4;
        }
        .checklist {
            list-style: none;
            font-size: 13px;
            line-height: 1.8;
        }
        .checklist li::before {
            content: "✓ ";
            color: #4ecdc4;
            font-weight: bold;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(78, 205, 196, 0.2);
            border: 1px solid #4ecdc4;
            border-radius: 4px;
            font-size: 12px;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        button:hover {
            background: #ff5252;
        }
        button.active {
            background: #4ecdc4;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <div id="info">
            <h1>🎭 Avatar Visibility Test</h1>
            <ul class="checklist">
                <li>Actor at position (0, 0, 0)</li>
                <li>Camera at (0, 0, 5)</li>
                <li>Dark background (0x1a1a2e)</li>
                <li>Ambient light (0.4 intensity)</li>
                <li>Directional light (1.0 intensity)</li>
                <li>Point fill light (0.5 intensity)</li>
                <li>Shadows enabled</li>
                <li>Bright actor colors</li>
            </ul>
            <div class="status">
                <strong>Status:</strong> <span id="status">Loading...</span>
            </div>
        </div>
        <div id="controls">
            <button onclick="activateActor('comedian')">Comedian</button>
            <button onclick="activateActor('scientist')">Scientist</button>
            <button onclick="activateActor('philosopher')">Philosopher</button>
            <button onclick="rotateCamera()">Rotate Cam</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        // Configuration matching the robust defaults
        const CONFIG = {
            background: 0x1a1a2e,
            camera: { pos: { x: 0, y: 0, z: 5 }, fov: 75 },
            lights: {
                ambient: { color: 0xffffff, intensity: 0.4 },
                directional: { color: 0xffffff, intensity: 1.0, pos: { x: 5, y: 10, z: 7 } },
                point: { color: 0xffffff, intensity: 0.5, pos: { x: 0, y: 2, z: 3 } }
            },
            actors: [
                { id: 'comedian', color: '#ff6b6b', x: -2 },
                { id: 'scientist', color: '#45b7d1', x: 0 },
                { id: 'philosopher', color: '#4ecdc4', x: 2 }
            ]
        };

        let scene, camera, renderer, actors = new Map(), activeActor = null;
        let cameraAngle = 0;

        function init() {
            const canvas = document.getElementById('canvas');
            
            // Scene with contrasting background
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.background);

            // Camera at (0, 0, 5)
            camera = new THREE.PerspectiveCamera(
                CONFIG.camera.fov,
                window.innerWidth / window.innerHeight,
                0.1, 1000
            );
            camera.position.set(CONFIG.camera.pos.x, CONFIG.camera.pos.y, CONFIG.camera.pos.z);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Lighting setup
            const ambient = new THREE.AmbientLight(
                CONFIG.lights.ambient.color,
                CONFIG.lights.ambient.intensity
            );
            scene.add(ambient);

            const directional = new THREE.DirectionalLight(
                CONFIG.lights.directional.color,
                CONFIG.lights.directional.intensity
            );
            directional.position.set(
                CONFIG.lights.directional.pos.x,
                CONFIG.lights.directional.pos.y,
                CONFIG.lights.directional.pos.z
            );
            directional.castShadow = true;
            scene.add(directional);

            const point = new THREE.PointLight(
                CONFIG.lights.point.color,
                CONFIG.lights.point.intensity
            );
            point.position.set(
                CONFIG.lights.point.pos.x,
                CONFIG.lights.point.pos.y,
                CONFIG.lights.point.pos.z
            );
            scene.add(point);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(20, 10);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.8;
            ground.receiveShadow = true;
            scene.add(ground);

            // Actors
            CONFIG.actors.forEach(actorConfig => {
                const actor = createActor(actorConfig);
                actors.set(actorConfig.id, actor);
                scene.add(actor.group);
            });

            // Status update
            document.getElementById('status').textContent = 
                `✅ ${actors.size} avatars rendered and visible`;

            // Start render loop
            animate();

            // Handle resize
            window.addEventListener('resize', onResize);
        }

        function createActor(config) {
            const group = new THREE.Group();
            group.position.set(config.x, 0, 0);

            // Capsule body
            const geometry = new THREE.CapsuleGeometry(0.3, 1, 4, 8);
            const material = new THREE.MeshPhongMaterial({ 
                color: config.color,
                shininess: 30
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = 0;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            group.add(mesh);

            // Face indicator
            const faceGeo = new THREE.BoxGeometry(0.2, 0.2, 0.1);
            const faceMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const face = new THREE.Mesh(faceGeo, faceMat);
            face.position.set(0, 0.2, 0.28);
            mesh.add(face);

            // Spotlight
            const spotlight = new THREE.SpotLight(0xffffff, 0);
            spotlight.position.set(0, 5, 2);
            spotlight.target = mesh;
            spotlight.angle = Math.PI / 6;
            spotlight.penumbra = 0.5;
            spotlight.castShadow = true;
            group.add(spotlight);

            return { group, mesh, spotlight, id: config.id };
        }

        function activateActor(id) {
            actors.forEach(actor => {
                actor.spotlight.intensity = (actor.id === id) ? 50 : 0;
            });
            activeActor = id;
            
            // Update button states
            document.querySelectorAll('button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(id)) {
                    btn.classList.add('active');
                }
            });
        }

        function rotateCamera() {
            cameraAngle += Math.PI / 4;
            const radius = 5;
            camera.position.x = Math.sin(cameraAngle) * radius;
            camera.position.z = Math.cos(cameraAngle) * radius;
            camera.lookAt(0, 0, 0);
        }

        window.activateActor = activateActor;
        window.rotateCamera = rotateCamera;

        function animate() {
            requestAnimationFrame(animate);
            
            // Subtle idle animation
            actors.forEach(actor => {
                if (actor.id === activeActor) {
                    const time = Date.now() * 0.005;
                    const scale = 1 + Math.sin(time) * 0.05;
                    actor.mesh.scale.set(1 / Math.sqrt(scale), scale, 1 / Math.sqrt(scale));
                    actor.mesh.position.y = 0.8 * (scale - 1);
                } else {
                    actor.mesh.scale.set(1, 1, 1);
                    actor.mesh.position.y = 0;
                }
            });

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
